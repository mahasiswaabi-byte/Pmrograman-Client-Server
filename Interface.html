<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar Sederhana</title>
    <link rel="stylesheet" href="Visual.css" />
  </head>

  <body>
    <header class="header">
      <nav class="navbar">
        <a class="logo" href="#" aria-label="Beranda">
          <img src="LogoArb.png" alt="Logo" class="logo-image" />
          <span>Arb.Wcite</span>
        </a>
      
        <ul class="nav-menu">
          <li><a href="#">Menu</a></li>
          <li><a href="#">Informasi</a></li>
          <li><a href="#">Perbaikan</a></li>
          <li><a href="#">Hubungi Kami</a></li>
        </ul>

        <a href="#login-modal" class="nav-button" id="login-button">Login</a>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-text">
        <p class="label">Simple & Modern</p>
        <h1>Navigation bar yang menarik dan mudah dipahami</h1>
        <p>Contoh navbar sederhana hanya dengan HTML dan CSS
        </p>
        <a href="#" class="hero-button">Lihat Dulu</a>
      </div>
    </main>

    <div class="login-modal" id="login-modal" role="dialog" aria-modal="true" aria-labelledby="login-title" hidden>
      <div class="login-box">
        <button class="close-button" id="close-login" type="button" aria-label="Tutup">&times;</button>
        <h2 id="login-title">Login</h2>
        <form id="login-form">
          <label for="username">Nama Pengguna:</label>
          <input id="username" name="username" type="text" autocomplete="username" required />

          <label for="password">Kata Sandi:</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required />
            <button class="password-toggle" id="password-toggle" type="button" aria-label="Tampilkan kata sandi" title="Tampilkan kata sandi">&#128065;</button>
          </div>

          <button class="submit-button" type="submit">Masuk</button>
          <p class="login-message" id="login-message" role="status"></p>
        </form>
      </div>
    </div>

    <script src="Login.js"></script>
    </body>
</html>
